name: Validate profile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SVG assets and README references
        run: python scripts/validate_assets.py

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 README.md
          fail: true
