<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
<title id="title">Rakesh Singh — cloud and applied AI engineering for fintech and regulated products</title>
<desc id="desc">An engineering-drawing style system map. An orchestrator node feeds three roles — architect, AI engineer and operator — which converge on a bus feeding four shipped systems: CloudMorph, Transmute, OpsMorph and VerbaSync. Proof chips read: 17 plus years, 95 percent less deployment effort, 15 million dollars plus saved.</desc>
<defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif}
.ring{animation:breathe 6s ease-in-out infinite}
.ring2{animation:breathe 6s ease-in-out infinite;animation-delay:-3s}
.sweep{animation:slide 8s linear infinite}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:.5}}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){.pkt{display:none}.ring,.ring2{animation:none;opacity:.28}.sweep{display:none}}
</style>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M44 0 L0 0 L0 44" fill="none" stroke="#161C24" stroke-width="1"/>
</pattern>
<radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#C98A4B" stop-opacity="0.20"/>
<stop offset="100%" stop-color="#C98A4B" stop-opacity="0"/>
</radialGradient>
<linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7FA3C9" stop-opacity="0"/>
<stop offset="50%" stop-color="#E6AC6B" stop-opacity="0.45"/>
<stop offset="100%" stop-color="#7FA3C9" stop-opacity="0"/>
</linearGradient>
<path id="r1" d="M676 231 C712 231 720 161 780 161 H1000"/>
<path id="r2" d="M676 231 H1000"/>
<path id="r3" d="M676 231 C712 231 720 301 780 301 H1000"/>
<path id="s1" d="M1000 140 H1050"/>
<path id="s2" d="M1000 192 H1050"/>
<path id="s3" d="M1000 244 H1050"/>
<path id="s4" d="M1000 296 H1050"/>
</defs>

<rect width="1200" height="430" fill="#0B0E13"/>
<rect width="1200" height="430" fill="url(#grid)"/>
<rect x="-1200" y="0" width="1200" height="1" fill="url(#sweepgrad)" class="sweep"/>

<g fill="none" stroke="#C98A4B" stroke-width="1.2">
<path d="M28 60 L28 28 L60 28"/>
<path d="M1172 28 L1140 28 M1172 28 L1172 60"/>
<path d="M28 370 L28 402 L60 402"/>
<path d="M1172 402 L1140 402 M1172 402 L1172 370"/>
</g>
<g class="mono" font-size="10" letter-spacing="1.5" fill="#6B7480" text-anchor="end">
<text x="1160" y="46">DWG RS-001 &#183; SYSTEM MAP</text>
<text x="1160" y="60">SCALE &#8212; NONE &#183; REV B</text>
</g>

<text class="mono" x="80" y="70" font-size="14" letter-spacing="1.5" fill="#E6AC6B">// AVAILABLE FOR SELECTED REMOTE ENGAGEMENTS</text>
<text class="sans" x="80" y="150" font-size="58" font-weight="700" fill="#E9EDF2">Rakesh Singh</text>
<text class="sans" x="80" y="188" font-size="21" fill="#9AA5B4">Cloud &amp; applied AI engineering</text>
<text class="sans" x="80" y="216" font-size="21" fill="#9AA5B4">for fintech and regulated products</text>
<rect x="80" y="238" width="52" height="3" fill="#C98A4B"/>

<g>
<rect x="80" y="270" width="140" height="56" rx="3" fill="#151B23" stroke="#3A3226" stroke-width="1"/>
<text class="mono" x="96" y="300" font-size="21" font-weight="700" fill="#E6AC6B">17+</text>
<text class="mono" x="96" y="317" font-size="10" letter-spacing="1" fill="#808B99">YEARS</text>

<rect x="232" y="270" width="176" height="56" rx="3" fill="#151B23" stroke="#3A3226" stroke-width="1"/>
<text class="mono" x="248" y="300" font-size="21" font-weight="700" fill="#E6AC6B">&#8595;95%</text>
<text class="mono" x="248" y="317" font-size="10" letter-spacing="1" fill="#808B99">DEPLOY EFFORT</text>

<rect x="420" y="270" width="150" height="56" rx="3" fill="#151B23" stroke="#3A3226" stroke-width="1"/>
<text class="mono" x="436" y="300" font-size="21" font-weight="700" fill="#E6AC6B">$15M+</text>
<text class="mono" x="436" y="317" font-size="10" letter-spacing="1" fill="#808B99">SAVED</text>
</g>

<text class="mono" x="80" y="368" font-size="11" letter-spacing="1.5" fill="#5A6470">ARCHITECTURE &#8594; PLATFORM &#8594; PRODUCT &#8594; OPERATIONS &#8212; AND BACK</text>

<circle cx="660" cy="231" r="112" fill="url(#coreglow)"/>
<circle cx="660" cy="231" r="64" fill="none" stroke="#3A2C1A" stroke-width="1" class="ring"/>
<circle cx="660" cy="231" r="88" fill="none" stroke="#2A2016" stroke-width="1" class="ring2"/>
<circle cx="660" cy="231" r="42" fill="#151B23" stroke="#C98A4B" stroke-width="1.5"/>
<text class="mono" x="660" y="238" font-size="20" fill="#E6AC6B" text-anchor="middle">RS</text>
<text class="mono" x="660" y="332" font-size="12" letter-spacing="1.5" fill="#5A6470" text-anchor="middle">ORCHESTRATOR</text>

<g fill="none" stroke="#3E5872" stroke-width="1" stroke-dasharray="4 5">
<use href="#r1"/><use href="#r2"/><use href="#r3"/>
</g>
<g fill="none" stroke="#5A4530" stroke-width="1" stroke-dasharray="3 4">
<use href="#s1"/><use href="#s2"/><use href="#s3"/><use href="#s4"/>
</g>
<rect x="999" y="140" width="2" height="156" fill="#4A3D28"/>

<g class="pkt" fill="#7FA3C9">
<circle r="3.4"><animateMotion dur="3.4s" repeatCount="indefinite" begin="0s"><mpath href="#r1"/></animateMotion></circle>
<circle r="3.4"><animateMotion dur="3.4s" repeatCount="indefinite" begin="1.1s"><mpath href="#r2"/></animateMotion></circle>
<circle r="3.4"><animateMotion dur="3.4s" repeatCount="indefinite" begin="2.2s"><mpath href="#r3"/></animateMotion></circle>
</g>
<g class="pkt" fill="#E6AC6B">
<circle r="3"><animateMotion dur="2.1s" repeatCount="indefinite" begin="0.4s"><mpath href="#s1"/></animateMotion></circle>
<circle r="3"><animateMotion dur="2.1s" repeatCount="indefinite" begin="1s"><mpath href="#s2"/></animateMotion></circle>
<circle r="3"><animateMotion dur="2.1s" repeatCount="indefinite" begin="1.6s"><mpath href="#s3"/></animateMotion></circle>
<circle r="3"><animateMotion dur="2.1s" repeatCount="indefinite" begin="2.2s"><mpath href="#s4"/></animateMotion></circle>
</g>

<g fill="#141A23" stroke="#3E5872" stroke-width="1">
<rect x="780" y="139" width="220" height="44" rx="22"/>
<rect x="780" y="209" width="220" height="44" rx="22"/>
<rect x="780" y="279" width="220" height="44" rx="22"/>
</g>
<g class="mono" font-size="16" fill="#A9C2DA" text-anchor="middle">
<text x="890" y="166">architect</text>
<text x="890" y="236">ai engineer</text>
<text x="890" y="306">operator</text>
</g>
<text class="mono" x="890" y="120" font-size="11" letter-spacing="2" fill="#5A6470" text-anchor="middle">ROLES</text>

<g fill="#151109" stroke="#C98A4B" stroke-width="1">
<rect x="1050" y="118" width="150" height="44" rx="4"/>
<rect x="1050" y="170" width="150" height="44" rx="4"/>
<rect x="1050" y="222" width="150" height="44" rx="4"/>
<rect x="1050" y="274" width="150" height="44" rx="4"/>
</g>
<g class="mono" font-size="15" fill="#E6AC6B" text-anchor="middle">
<text x="1125" y="145">cloudmorph</text>
<text x="1125" y="197">transmute</text>
<text x="1125" y="249">opsmorph</text>
<text x="1125" y="301">verbasync</text>
</g>
<text class="mono" x="1125" y="342" font-size="11" letter-spacing="1.5" fill="#5A6470" text-anchor="middle">SHIPPED SYSTEMS</text>
</svg>
