<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
<title id="title">Rakesh Singh — cloud and applied AI engineering for fintech and regulated products</title>
<desc id="desc">A system map. An orchestrator node connects to three roles — architect, AI engineer and operator — which in turn feed three shipped systems: CloudMorph, Transmute and Kovil. Proof line reads: 17 plus years, 95 percent less deployment effort, 15 million dollars plus saved.</desc>
<defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif}
.ring{animation:breathe 6s ease-in-out infinite}
.ring2{animation:breathe 6s ease-in-out infinite;animation-delay:-3s}
.sweep{animation:slide 7s linear infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){.pkt{display:none}.ring,.ring2{animation:none;opacity:.45}.sweep{display:none}}
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0 L0 0 L0 40" fill="none" stroke="#E7EDF1" stroke-width="1"/>
</pattern>
<radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#0E7490" stop-opacity="0.12"/>
<stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
</radialGradient>
<linearGradient id="sweepgrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#0E7490" stop-opacity="0"/>
<stop offset="50%" stop-color="#0E7490" stop-opacity="0.45"/>
<stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
</linearGradient>
<path id="e1" d="M682 190 C724 190 732 140 770 140"/>
<path id="e2" d="M682 190 L770 190"/>
<path id="e3" d="M682 190 C724 190 732 240 770 240"/>
<path id="e4" d="M950 140 L1000 140"/>
<path id="e5" d="M950 190 L1000 190"/>
<path id="e6" d="M950 240 L1000 240"/>
</defs>

<rect width="1200" height="380" fill="#FBFCFD"/>
<rect width="1200" height="380" fill="url(#grid)"/>
<rect x="-1200" y="0" width="1200" height="1" fill="url(#sweepgrad)" class="sweep"/>

<g fill="none" stroke="#0E7490" stroke-width="1">
<path d="M32 62 L32 32 L62 32"/>
<path d="M1168 32 L1138 32 M1168 32 L1168 62"/>
<path d="M32 318 L32 348 L62 348"/>
<path d="M1168 348 L1138 348 M1168 348 L1168 318"/>
</g>

<text class="mono" x="80" y="112" font-size="19" fill="#0E7490">// available for selected remote engagements</text>
<text class="sans" x="80" y="188" font-size="64" fill="#0B1220">Rakesh Singh</text>
<text class="sans" x="80" y="228" font-size="24" fill="#55666F">Cloud &amp; applied AI engineering</text>
<text class="sans" x="80" y="258" font-size="24" fill="#55666F">for fintech and regulated products</text>
<rect x="80" y="284" width="48" height="2" fill="#0E7490"/>
<text class="mono" x="80" y="318" font-size="17" fill="#33444D">17+ yrs · 95% less deploy effort · $15M+ saved</text>

<circle cx="640" cy="190" r="110" fill="url(#coreglow)"/>
<circle cx="640" cy="190" r="64" fill="none" stroke="#8FC6D4" stroke-width="1" class="ring"/>
<circle cx="640" cy="190" r="88" fill="none" stroke="#B4DAE3" stroke-width="1" class="ring2"/>
<circle cx="640" cy="190" r="42" fill="#EDF8FA" stroke="#0E7490" stroke-width="1.5"/>
<text class="mono" x="640" y="197" font-size="22" fill="#0E7490" text-anchor="middle">RS</text>
<text class="mono" x="640" y="290" font-size="15" fill="#7A8C95" text-anchor="middle">orchestrator</text>

<g fill="none" stroke="#79B7C9" stroke-width="1" stroke-dasharray="4 5">
<use href="#e1"/><use href="#e2"/><use href="#e3"/>
<use href="#e4"/><use href="#e5"/><use href="#e6"/>
</g>

<g class="pkt" fill="#0E7490">
<circle r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#e2"/></animateMotion></circle>
<circle r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="2.2s"><mpath href="#e3"/></animateMotion></circle>
<circle r="3" fill="#0F766E"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath href="#e4"/></animateMotion></circle>
<circle r="3" fill="#0F766E"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.7s"><mpath href="#e5"/></animateMotion></circle>
<circle r="3" fill="#0F766E"><animateMotion dur="2.4s" repeatCount="indefinite" begin="2.8s"><mpath href="#e6"/></animateMotion></circle>
</g>

<g fill="#EDF8FA" stroke="#0E7490" stroke-width="1">
<rect x="770" y="118" width="180" height="44" rx="22"/>
<rect x="770" y="168" width="180" height="44" rx="22"/>
<rect x="770" y="218" width="180" height="44" rx="22"/>
</g>
<g class="mono" font-size="17" fill="#0B4D5E" text-anchor="middle">
<text x="860" y="146">architect</text>
<text x="860" y="196">ai engineer</text>
<text x="860" y="246">operator</text>
</g>

<g fill="#F4F7F9" stroke="#D3DCE2" stroke-width="1">
<rect x="1000" y="118" width="160" height="44" rx="6"/>
<rect x="1000" y="168" width="160" height="44" rx="6"/>
<rect x="1000" y="218" width="160" height="44" rx="6"/>
</g>
<g class="mono" font-size="17" fill="#2B3B44" text-anchor="middle">
<text x="1080" y="146">cloudmorph</text>
<text x="1080" y="196">transmute</text>
<text x="1080" y="246">kovil</text>
</g>
<text class="mono" x="1080" y="290" font-size="15" fill="#7A8C95" text-anchor="middle">shipped systems</text>
</svg>
